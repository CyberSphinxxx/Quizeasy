<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Quizeasy — Paste questions, start studying</title>
    <meta
      name="description"
      content="Quizeasy is a local-first quiz maker. Paste formatted questions and answers, review the import, and study as flashcards, multiple choice, identification, or a mixed quiz. No account required."
    />
    <meta
      name="theme-color"
      content="#f6f2ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#161310"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      // When accessed via a direct pathname on web hosts with SPA rewrites (e.g. Vercel),
      // seamlessly normalize the pathname into a hash route before the router initializes.
      (function () {
        try {
          var path = window.location.pathname;
          var routeMatch = path.match(
            /\/(import|study|sets|guide|settings)(\/.*)?$/,
          );
          if (routeMatch && !window.location.hash) {
            window.history.replaceState(
              null,
              '',
              '#' + routeMatch[0] + window.location.search,
            );
          }
        } catch (error) {
          /* History API may be restricted in sandbox environments */
        }
      })();
    </script>
    <script>
      // Set the theme class before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = window.localStorage.getItem('quizeasy.theme');
          var theme =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {
          /* localStorage may be unavailable (private mode): fall back to system. */
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <noscript>
      Quizeasy needs JavaScript because it stores your question sets locally in
      your browser.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
